# Fork CI (stealth-a16): builds MtkWlan.kext with the repo's own build script on a macOS runner with the newest Xcode,
# uploads it as an artifact, and on a stealth tag (v0.12.1-stealth.1 and the like) publishes a GitHub Release whose zip has
# the same layout as the upstream releases: MtkWlan-<version>/ with the kext, LICENSE, NOTICE.md and LICENSES/.
name: stealth
on:
  push:
    branches: [stealth-a16]
    tags: ['*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          xcodebuild -version
          clang --version | head -1
          xcrun --sdk macosx --show-sdk-path
      - name: Build (Release)
        run: tools/build-mac.sh
      - name: Link check (which kernel libraries the undefined symbols resolve to; informational)
        continue-on-error: true
        run: |
          K=$(ls -d out/*.kext | head -1); B=$K/Contents/MacOS/$(basename "$K" .kext)
          nm -u -arch x86_64 "$B" | sort -u > /tmp/undef.txt
          : > /tmp/exports.txt
          for k in /System/Library/Extensions/System.kext/PlugIns/*.kext; do
            id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$k/Info.plist" 2>/dev/null) || continue
            f=$(ls "$k"/* 2>/dev/null | grep -v Info.plist | head -1); [ -f "$f" ] || f="$k/Contents/MacOS/$(basename "$k" .kext)"
            nm -gU -arch x86_64 "$f" 2>/dev/null | awk -v id="$id" '{print $NF, id}' >> /tmp/exports.txt
          done
          echo "export entries read: $(wc -l < /tmp/exports.txt)"
          /usr/libexec/PlistBuddy -c 'Print :OSBundleLibraries' Info.plist
          python3 - <<'PY'
          import collections
          ex = collections.defaultdict(set)
          for l in open('/tmp/exports.txt'):
              p = l.split()
              if len(p) == 2: ex[p[0]].add(p[1])
          und = [l.strip() for l in open('/tmp/undef.txt') if l.strip()]
          kpi = [s for s in und if s in ex]
          print("undefined %d, found in System.kext pseudo-kexts %d" % (len(und), len(kpi)))
          for s in ('_PE_parse_boot_argn', '_PE_parse_boot_arg_str', '_kernel_thread_start', '_clock_get_uptime'):
              if s in und: print(s, sorted(ex.get(s, [])))
          PY
      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then VER=${GITHUB_REF_NAME#v}; else VER=${SHORT}-${GITHUB_SHA::7}; fi
          D=MtkWlan-$VER
          rm -rf dist && mkdir -p dist/$D
          cp -R out/MtkWlan.kext LICENSE NOTICE.md LICENSES dist/$D/
          (cd dist && zip -r -X -q $D-RELEASE.zip $D)
          (cd dist && shasum -a 256 $D-RELEASE.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          shasum -a 256 out/MtkWlan.kext/Contents/MacOS/MtkWlan
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$D-RELEASE.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.dir }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            dist/SHA256SUMS.txt
      - name: Release
        if: github.ref_type == 'tag' && contains(github.ref_name, '-stealth')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(printf 'Fork build of MtkWlan for the MSI Stealth A16 AI+ (MT7925, branch stealth-a16): adds sleep and wake handling.\nBuilt by GitHub Actions on %s with %s. Not tested on hardware by the CI.\nSee CHANGELOG.md for what changed against upstream.\n' "$(sw_vers -productVersion)" "$(xcodebuild -version | head -1)")
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.zip }}" dist/SHA256SUMS.txt \
            --title "MtkWlan ${GITHUB_REF_NAME#v}" --notes "$NOTES" --verify-tag
